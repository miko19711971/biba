<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Free Scarf Styling – Biba Boutique</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  min-height:100vh;
  background:#0a0a0a;
  font-family:'Arial', sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  position:relative;
}

/* ambient glow */
body::before{
  content:'';
  position:fixed;inset:0;
  background:
    radial-gradient(circle at 20% 30%, rgba(201,168,106,0.10) 0%, transparent 50%),
    radial-gradient(circle at 80% 70%, rgba(201,168,106,0.07) 0%, transparent 50%);
  pointer-events:none;
}

/* sparkle stars */
.stars{position:fixed;inset:0;pointer-events:none;overflow:hidden;}
.star{
  position:absolute;width:2px;height:2px;border-radius:50%;
  background:#c9a86a;opacity:0;animation:twinkle 3s infinite;
}
@keyframes twinkle{
  0%,100%{opacity:0;transform:scale(0.5)}
  50%{opacity:0.6;transform:scale(1)}
}

/* card */
.card{
  position:relative;
  width:92%;max-width:380px;
  text-align:center;
  padding:36px 28px 32px;
  z-index:1;
  border:1px solid rgba(201,168,106,0.15);
  border-radius:20px;
  background:rgba(255,255,255,0.02);
  backdrop-filter:blur(4px);
}

/* brand */
.brand{
  font-size:10px;
  letter-spacing:6px;
  text-transform:uppercase;
  color:rgba(201,168,106,0.5);
  margin-bottom:28px;
}

/* checkmark */
.check{
  width:56px;height:56px;
  background:rgba(201,168,106,0.10);
  border:2px solid rgba(201,168,106,0.60);
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 20px;
  font-size:26px;
  color:#c9a86a;
  animation:popIn 0.5s cubic-bezier(0.175,0.885,0.32,1.275) both;
}
@keyframes popIn{
  from{transform:scale(0);opacity:0}
  to{transform:scale(1);opacity:1}
}

/* headline */
.headline{
  font-size:13px;
  letter-spacing:3px;
  text-transform:uppercase;
  color:rgba(255,255,255,0.45);
  margin-bottom:8px;
  font-weight:400;
}

/* hero */
.discount{
  font-size:46px;
  font-weight:900;
  line-height:1;
  text-transform:uppercase;
  background:linear-gradient(135deg,#c9a86a 0%,#f0d78a 50%,#c9a86a 100%);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
  letter-spacing:-1px;
  margin-bottom:8px;
}

/* activated line */
.activated{
  font-size:13px;
  letter-spacing:3px;
  text-transform:uppercase;
  color:rgba(255,255,255,0.45);
  margin-bottom:20px;
}

/* divider */
.divider{
  width:40px;height:1px;
  background:rgba(201,168,106,0.3);
  margin:0 auto 18px;
}

/* applies-to */
.applies{
  font-size:14px;
  color:rgba(255,255,255,0.75);
  letter-spacing:1px;
  line-height:1.7;
  margin-bottom:6px;
}
.applies strong{
  color:#c9a86a;
  font-weight:700;
}

/* location */
.location{
  font-size:10px;
  letter-spacing:2px;
  text-transform:uppercase;
  color:rgba(255,255,255,0.2);
  margin-bottom:28px;
}

/* CTA */
.cta{
  width:100%;
  padding:16px 20px;
  background:#c9a86a;
  color:#0a0a0a;
  border:none;
  border-radius:50px;
  font-size:12px;
  font-weight:900;
  letter-spacing:2px;
  text-transform:uppercase;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  box-shadow:0 6px 30px rgba(201,168,106,0.3);
}

/* small phones: la card non viene piu' tagliata */
@media (max-height:620px){
  body{overflow:auto;align-items:flex-start;padding:14px 0;}
  .card{padding:26px 24px 24px;}
  .brand{margin-bottom:20px;}
  .check{margin-bottom:16px;}
  .discount{font-size:40px;}
  .location{margin-bottom:20px;}
}
</style>
</head>
<body>

<div class="stars" id="stars"></div>

<div class="card">
  <div class="brand">Biba Boutique · Roma</div>

  <div class="check">✦</div>

  <div class="headline">Free 3-minute</div>
  <div class="discount">Scarf<br>Styling</div>
  <div class="activated">no purchase required</div>

  <div class="divider"></div>

  <div class="applies">
    Discover <strong>6 ways</strong> to wear it<br>
    Scopri <strong>6 modi</strong> per indossarlo<br>
    Découvrez <strong>6 façons</strong> de le porter<br>
    Descubre <strong>6 formas</strong> de llevarlo
  </div>
  <div class="location">Via delle Muratte 88 · Rome</div>

  <div class="cta">Come inside</div>
</div>

<script>
var GAS = 'https://script.google.com/macros/s/AKfycbx0Qd3zb39OjjG4BhOjX3Ph7h85WIYMGnBm9imZn3tSej54h4YWaAlFjfeIwG400_Jx/exec';

// sparkle stars
(function(){
  var s = document.getElementById('stars');
  for(var i = 0; i < 50; i++){
    var d = document.createElement('div');
    d.className = 'star';
    d.style.left = Math.random()*100+'%';
    d.style.top  = Math.random()*100+'%';
    d.style.animationDelay    = Math.random()*4+'s';
    d.style.animationDuration = (2+Math.random()*3)+'s';
    s.appendChild(d);
  }
})();

function logSheet(token, tipo){
  try{
    fetch(GAS,{
      method:'POST', mode:'no-cors',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({token:token, tipo:tipo, timestamp:new Date().toISOString()})
    });
  }catch(e){}
}

function genToken(){
  var c = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', t = 'BIBA-';
  for(var i = 0; i < 6; i++) t += c[Math.floor(Math.random()*c.length)];
  return t;
}

// Token stabile per dispositivo (localStorage), una riga per visita (sessionStorage).
// tipo 'vetrina_styling' per distinguerlo dalle righe della vecchia offerta -50%.
var token = localStorage.getItem('bibaVetrinaToken');
if(!token){
  token = genToken();
  localStorage.setItem('bibaVetrinaToken', token);
}
if(!sessionStorage.getItem('bibaVisitLogged')){
  sessionStorage.setItem('bibaVisitLogged', '1');
  logSheet(token, 'vetrina_styling');
}
</script>
</body>
</html>

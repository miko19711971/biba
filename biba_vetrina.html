<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#0a0a0a"/>
<title>Buy 2, Get the 3rd Free – Biba Boutique</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}

html,body{background:#0a0a0a;}

body{
  min-height:100vh;
  min-height:100dvh;
  font-family:'Arial', sans-serif;
  position:relative;
  overflow-x:hidden;
}

/* ambient glow */
body::before{
  content:'';
  position:fixed;inset:0;
  background:
    radial-gradient(circle at 20% 25%, rgba(255,200,0,0.22) 0%, transparent 55%),
    radial-gradient(circle at 80% 75%, rgba(255,170,0,0.16) 0%, transparent 55%);
  pointer-events:none;
  z-index:0;
}

/* sparkle stars */
.stars{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0;}
.star{
  position:absolute;width:2px;height:2px;border-radius:50%;
  background:#ffd700;opacity:0;animation:twinkle 3s infinite;
}
@keyframes twinkle{
  0%,100%{opacity:0;transform:scale(0.5)}
  50%{opacity:0.6;transform:scale(1)}
}

/* schermata intera, tutto centrato verticalmente */
.screen{
  position:relative;
  z-index:1;
  min-height:100vh;
  min-height:100dvh;
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  gap:clamp(14px, 2.6vh, 30px);
  padding:
    calc(env(safe-area-inset-top) + 24px)
    clamp(18px, 6vw, 40px)
    calc(env(safe-area-inset-bottom) + 24px);
}

/* badge */
.check{
  width:clamp(56px, 15vw, 78px);
  height:clamp(56px, 15vw, 78px);
  background:rgba(255,215,0,0.15);
  border:2px solid #ffd700;
  box-shadow:0 0 18px rgba(255,215,0,0.5);
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:clamp(26px, 7vw, 36px);
  color:#ffd700;
  animation:popIn 0.5s cubic-bezier(0.175,0.885,0.32,1.275) both;
  flex:none;
}
@keyframes popIn{
  from{transform:scale(0);opacity:0}
  to{transform:scale(1);opacity:1}
}

/* headline */
.headline{
  font-size:clamp(19px, 5.6vw, 30px);
  font-weight:700;
  letter-spacing:2px;
  text-transform:uppercase;
  color:#ffffff;
  margin-bottom:clamp(6px, 1.2vh, 12px);
}

/* hero */
.discount{
  font-size:clamp(40px, 13.5vw, 96px);
  font-weight:900;
  line-height:0.98;
  text-transform:uppercase;
  background:linear-gradient(135deg,#ffb300 0%,#fff176 50%,#ffb300 100%);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
  letter-spacing:-1px;
  filter:drop-shadow(0 0 14px rgba(255,200,0,0.75));
  animation:blink 1.2s step-end infinite;
}
@keyframes blink{
  0%{opacity:1}
  65%{opacity:0.15}
}

/* sottotitolo */
.activated{
  font-size:clamp(16px, 4.8vw, 26px);
  font-weight:700;
  letter-spacing:2px;
  text-transform:uppercase;
  color:#ffd23f;
  margin-top:clamp(8px, 1.4vh, 14px);
}
</style>
</head>
<body>

<div class="stars" id="stars"></div>

<div class="screen">

  <div class="check">✦</div>

  <div>
    <div class="headline" data-t="headline"></div>
    <div class="discount" data-t="hero"></div>
    <div class="activated" data-t="sub"></div>
  </div>

</div>

<script>
var GAS = 'https://script.google.com/macros/s/AKfycbx0Qd3zb39OjjG4BhOjX3Ph7h85WIYMGnBm9imZn3tSej54h4YWaAlFjfeIwG400_Jx/exec';

var I18N = {
  en:{headline:'Special offer', hero:'Buy 2<br>3rd free', sub:'in store now',
      voice:'Special offer at Biba Boutique. Buy two items and get the third one free. Come inside!'},
  it:{headline:'Offerta speciale', hero:'Compri 2<br>3° gratis', sub:'in negozio adesso',
      voice:'Offerta speciale da Biba Boutique. Compra due articoli e il terzo è in regalo. Entra a trovarci!'},
  fr:{headline:'Offre spéciale', hero:'2 achetés<br>3e offert', sub:'en boutique maintenant',
      voice:'Offre spéciale chez Biba Boutique. Achetez deux articles et le troisième est offert. Entrez nous voir !'},
  de:{headline:'Sonderangebot', hero:'Kauf 2<br>3. gratis', sub:'jetzt im Laden',
      voice:'Sonderangebot bei Biba Boutique. Kaufen Sie zwei Artikel, und der dritte ist gratis. Kommen Sie herein!'},
  es:{headline:'Oferta especial', hero:'Compra 2<br>3º gratis', sub:'ya en tienda',
      voice:'Oferta especial en Biba Boutique. Compra dos artículos y el tercero es gratis. ¡Entra a vernos!'}
};

var lang = 'en';
function t(key){ return (I18N[lang]||I18N.en)[key] || I18N.en[key] || ''; }

/* Voce: stesso sistema delle guide check-in (voci del telefono, speechSynthesis) */
var VOICE_PREFS = {
  en:['Samantha','Google US English','Google UK English Female','Microsoft Aria Online (Natural)'],
  it:['Alice','Eloisa','Google italiano','Microsoft Elsa Online (Natural)','Microsoft Isabella Online (Natural)'],
  fr:['Amelie','Thomas','Google français','Microsoft Denise Online (Natural)','Microsoft Vivienne Online (Natural)'],
  de:['Anna','Markus','Google Deutsch','Microsoft Katja Online (Natural)','Microsoft Conrad Online (Natural)'],
  es:['Monica','Jorge','Paulina','Google español','Microsoft Alvaro Online (Natural)']
};

var pick = null;

function selectVoice(){
  if(!('speechSynthesis' in window)) return null;
  var all = speechSynthesis.getVoices() || [];
  var prefs = VOICE_PREFS[lang] || [];
  for(var i = 0; i < prefs.length; i++){
    var name = prefs[i].toLowerCase();
    var v = all.find(function(x){ return (x.name||'').toLowerCase() === name; });
    if(v) return v;
  }
  return all.find(function(x){ return (x.lang||'').toLowerCase().indexOf(lang) === 0; }) || null;
}

function refreshVoice(){ pick = selectVoice(); }

if('speechSynthesis' in window){
  refreshVoice();
  speechSynthesis.onvoiceschanged = refreshVoice;
}

function speak(){
  if(!('speechSynthesis' in window)) return;
  try{
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(t('voice'));
    if(pick) u.voice = pick;
    u.lang = pick ? pick.lang : lang;
    speechSynthesis.speak(u);
  }catch(e){}
}

function setLang(newLang){
  lang = I18N[newLang] ? newLang : 'en';
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-t]').forEach(function(el){
    el.innerHTML = t(el.getAttribute('data-t'));
  });
  refreshVoice();
}

// Lingua: ?lang=xx, altrimenti quella del telefono, altrimenti inglese
(function(){
  var p = new URLSearchParams(location.search).get('lang');
  var l = (p || navigator.language || 'en').slice(0,2).toLowerCase();
  setLang(I18N[l] ? l : 'en');
})();

// I browser parlano solo dopo un tocco: si prova subito (alcuni Android lo permettono),
// poi il primo tocco in un punto qualunque della pagina fa partire la voce.
speak();
var spokenByTouch = false;
document.addEventListener('pointerdown', function(){
  if(spokenByTouch) return;
  spokenByTouch = true;
  speak();
});

// sparkle stars
(function(){
  var s = document.getElementById('stars');
  for(var i = 0; i < 50; i++){
    var d = document.createElement('div');
    d.className = 'star';
    d.style.left = Math.random()*100+'%';
    d.style.top  = Math.random()*100+'%';
    d.style.animationDelay    = Math.random()*4+'s';
    d.style.animationDuration = (2+Math.random()*3)+'s';
    s.appendChild(d);
  }
})();

function logSheet(token, tipo){
  try{
    fetch(GAS,{
      method:'POST', mode:'no-cors',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({token:token, tipo:tipo, lang:lang, timestamp:new Date().toISOString()})
    });
  }catch(e){}
}

function genToken(){
  var c = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', t = 'BIBA-';
  for(var i = 0; i < 6; i++) t += c[Math.floor(Math.random()*c.length)];
  return t;
}

// Token stabile per dispositivo (localStorage), una riga per visita (sessionStorage).
// tipo 'vetrina_3x2' per distinguerlo dalle righe delle offerte precedenti (-50%, styling).
var token = localStorage.getItem('bibaVetrinaToken');
if(!token){
  token = genToken();
  localStorage.setItem('bibaVetrinaToken', token);
}
if(!sessionStorage.getItem('bibaVisitLogged')){
  sessionStorage.setItem('bibaVisitLogged', '1');
  logSheet(token, 'vetrina_3x2');
}
</script>
</body>
</html>

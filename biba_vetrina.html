<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#0a0a0a"/>
<title>Free Scarf Styling – Biba Boutique</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}

html,body{background:#0a0a0a;}

body{
  min-height:100vh;
  min-height:100dvh;
  font-family:'Arial', sans-serif;
  position:relative;
  overflow-x:hidden;
}

/* ambient glow */
body::before{
  content:'';
  position:fixed;inset:0;
  background:
    radial-gradient(circle at 20% 25%, rgba(201,168,106,0.12) 0%, transparent 55%),
    radial-gradient(circle at 80% 75%, rgba(201,168,106,0.08) 0%, transparent 55%);
  pointer-events:none;
  z-index:0;
}

/* sparkle stars */
.stars{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0;}
.star{
  position:absolute;width:2px;height:2px;border-radius:50%;
  background:#c9a86a;opacity:0;animation:twinkle 3s infinite;
}
@keyframes twinkle{
  0%,100%{opacity:0;transform:scale(0.5)}
  50%{opacity:0.6;transform:scale(1)}
}

/* schermata intera, tutto centrato verticalmente */
.screen{
  position:relative;
  z-index:1;
  min-height:100vh;
  min-height:100dvh;
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  gap:clamp(14px, 2.6vh, 30px);
  padding:
    calc(env(safe-area-inset-top) + 24px)
    clamp(18px, 6vw, 40px)
    calc(env(safe-area-inset-bottom) + 24px);
}

/* badge */
.check{
  width:clamp(56px, 15vw, 78px);
  height:clamp(56px, 15vw, 78px);
  background:rgba(201,168,106,0.10);
  border:2px solid rgba(201,168,106,0.60);
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:clamp(26px, 7vw, 36px);
  color:#c9a86a;
  animation:popIn 0.5s cubic-bezier(0.175,0.885,0.32,1.275) both;
  flex:none;
}
@keyframes popIn{
  from{transform:scale(0);opacity:0}
  to{transform:scale(1);opacity:1}
}

/* headline */
.headline{
  font-size:clamp(19px, 5.6vw, 30px);
  font-weight:700;
  letter-spacing:2px;
  text-transform:uppercase;
  color:rgba(255,255,255,0.88);
  margin-bottom:clamp(6px, 1.2vh, 12px);
}

/* hero */
.discount{
  font-size:clamp(46px, 16.5vw, 104px);
  font-weight:900;
  line-height:0.98;
  text-transform:uppercase;
  background:linear-gradient(135deg,#c9a86a 0%,#f0d78a 50%,#c9a86a 100%);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
  letter-spacing:-1px;
}

/* sottotitolo */
.activated{
  font-size:clamp(16px, 4.8vw, 26px);
  font-weight:700;
  letter-spacing:2px;
  text-transform:uppercase;
  color:#c9a86a;
  margin-top:clamp(8px, 1.4vh, 14px);
}

/* divider */
.divider{
  width:clamp(40px, 12vw, 64px);
  height:1px;
  background:rgba(201,168,106,0.3);
  flex:none;
}

/* 4 lingue */
.applies{
  font-size:clamp(15px, 4.3vw, 22px);
  color:rgba(255,255,255,0.78);
  letter-spacing:0.5px;
  line-height:1.8;
}
.applies strong{
  color:#c9a86a;
  font-weight:700;
}

/* CTA */
.cta{
  width:100%;
  max-width:520px;
  padding:clamp(16px, 2.4vh, 22px) 20px;
  background:#c9a86a;
  color:#0a0a0a;
  border:none;
  border-radius:50px;
  font-size:clamp(13px, 3.6vw, 17px);
  font-weight:900;
  letter-spacing:3px;
  text-transform:uppercase;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 6px 30px rgba(201,168,106,0.3);
  flex:none;
  margin-top:clamp(4px, 1vh, 12px);
}
</style>
</head>
<body>

<div class="stars" id="stars"></div>

<div class="screen">

  <div class="check">✦</div>

  <div>
    <div class="headline">Free · 3 minutes</div>
    <div class="discount">Scarf<br>Styling</div>
    <div class="activated">no purchase required</div>
  </div>

  <div class="divider"></div>

  <div class="applies">
    Discover <strong>6 ways</strong> to wear it<br>
    Scopri <strong>6 modi</strong> per indossarlo<br>
    Découvrez <strong>6 façons</strong> de le porter<br>
    Descubre <strong>6 formas</strong> de llevarlo
  </div>

  <div class="cta">Come inside</div>
</div>

<script>
var GAS = 'https://script.google.com/macros/s/AKfycbx0Qd3zb39OjjG4BhOjX3Ph7h85WIYMGnBm9imZn3tSej54h4YWaAlFjfeIwG400_Jx/exec';

// sparkle stars
(function(){
  var s = document.getElementById('stars');
  for(var i = 0; i < 50; i++){
    var d = document.createElement('div');
    d.className = 'star';
    d.style.left = Math.random()*100+'%';
    d.style.top  = Math.random()*100+'%';
    d.style.animationDelay    = Math.random()*4+'s';
    d.style.animationDuration = (2+Math.random()*3)+'s';
    s.appendChild(d);
  }
})();

function logSheet(token, tipo){
  try{
    fetch(GAS,{
      method:'POST', mode:'no-cors',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({token:token, tipo:tipo, timestamp:new Date().toISOString()})
    });
  }catch(e){}
}

function genToken(){
  var c = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', t = 'BIBA-';
  for(var i = 0; i < 6; i++) t += c[Math.floor(Math.random()*c.length)];
  return t;
}

// Token stabile per dispositivo (localStorage), una riga per visita (sessionStorage).
// tipo 'vetrina_styling' per distinguerlo dalle righe della vecchia offerta -50%.
var token = localStorage.getItem('bibaVetrinaToken');
if(!token){
  token = genToken();
  localStorage.setItem('bibaVetrinaToken', token);
}
if(!sessionStorage.getItem('bibaVisitLogged')){
  sessionStorage.setItem('bibaVisitLogged', '1');
  logSheet(token, 'vetrina_styling');
}
</script>
</body>
</html>
